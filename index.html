<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>基礎加減乘除互動練習</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f0f4f8; }
        .card { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { font-size: 2.5rem; color: #333; }
        input { font-size: 1.5rem; width: 120px; text-align: center; padding: 5px; }
        button { font-size: 1.2rem; padding: 8px 16px; margin-left: 10px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 6px; }
        #result { margin-top: 20px; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>數學小達人</h2>
    <p>請計算以下算式：</p>
    <div id="question" style="font-size: 2rem; margin: 20px 0; color: #2c3e50;"></div>
    <input type="number" id="answer" placeholder="輸入答案">
    <button onclick="checkAnswer()">提交</button>
    <div id="result"></div>
</div>

<script>
    let num1, num2, operator, correctAnswer;
    const ops = ['+', '-', '*', '/'];

    function generateQuestion() {
        operator = ops[Math.floor(Math.random() * ops.length)];
        
        if (operator === '+') {
            num1 = Math.floor(Math.random() * 50) + 1;
            num2 = Math.floor(Math.random() * 50) + 1;
            correctAnswer = num1 + num2;
        } else if (operator === '-') {
            num1 = Math.floor(Math.random() * 50) + 1;
            num2 = Math.floor(Math.random() * 50) + 1;
            if (num1 < num2) [num1, num2] = [num2, num1]; // 確保不出現負數
            correctAnswer = num1 - num2;
        } else if (operator === '*') {
            num1 = Math.floor(Math.random() * 10) + 1;
            num2 = Math.floor(Math.random() * 10) + 1;
            correctAnswer = num1 * num2;
        } else if (operator === '/') {
            num2 = Math.floor(Math.random() * 9) + 1;
            let multiplier = Math.floor(Math.random() * 10) + 1;
            num1 = num2 * multiplier; // 確保整除
            correctAnswer = multiplier;
        }

        document.getElementById('question').innerText = `${num1} ${operator} ${num2} = ?`;
        document.getElementById('answer').value = '';
        document.getElementById('result').innerText = '';
    }

    function checkAnswer() {
        let userAns = parseFloat(document.getElementById('answer').value);
        let resDiv = document.getElementById('result');
        if (userAns === correctAnswer) {
            resDiv.style.color = 'green';
            resDiv.innerText = '答對了！太棒了 🎉';
            setTimeout(generateQuestion, 1500); // 1.5秒後自動換下一題
        } else {
            resDiv.style.color = 'red';
            resDiv.innerText = '答錯囉，再試一次！';
        }
    }

    // 初始化第一题
    generateQuestion();
</script>

</body>
</html>
